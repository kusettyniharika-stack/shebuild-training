<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Calculator</title>
</head>
<body>

    <h1>Personal Expense Calculator</h1>

    <label>Income:</label>
    <input type="number" id="income"><br><br>

    <label>Food:</label>
    <input type="number" id="food"><br><br>

    <label>Travel:</label>
    <input type="number" id="travel"><br><br>

    <label>Education:</label>
    <input type="number" id="education"><br><br>

    <button onclick="calculate()">Calculate</button>

    <h2>Summary Report</h2>
    <p id="result"></p>

    <script>
        function calculate() {
            let income = Number(document.getElementById("income").value);
            let food = Number(document.getElementById("food").value);
            let travel = Number(document.getElementById("travel").value);
            let education = Number(document.getElementById("education").value);

            let total = food + travel + education;
            let savings = income - total;

            document.getElementById("result").innerHTML =
                "Total Expense: ₹" + total +
                "<br>Savings: ₹" + savings;
        }
    </script>

</body>
</html>
